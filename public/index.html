<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quiz App</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🧠 QuizClash</h1>
    <p class="subtitle">A Kahoot-style live quiz, powered by Google Sheets</p>

    <div class="card">
      <h2>I'm hosting</h2>
      <p>Create a game and display it on the big screen / projector.</p>
      <button onclick="window.location.href='host.html'">Host a Game</button>
    </div>

    <div class="card">
      <h2>I'm playing</h2>
      <p>Join a game using the PIN shown on the host's screen.</p>
      <button onclick="window.location.href='player.html'">Join a Game</button>
    </div>
  </div>
</body>
</html>
