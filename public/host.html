<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Host - QuizClash</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="host-body">
  <div class="container host-container">

    <!-- CREATE -->
    <div id="createView" class="card">
      <h1>QuizClash — Host</h1>
      <label class="field-label">Session Name (e.g. "Team A - Morning")</label>
      <input type="text" id="sessionNameInput" placeholder="Session name" maxlength="60" />
      <label class="field-label">Question Sheet Tab (choose which quiz to run)</label>
      <select id="sheetTabSelect"><option value="">Loading tabs…</option></select>
      <p id="tabLoadError" class="error-text"></p>
      <button id="createBtn">Create Game</button>
      <p id="createError" class="error-text"></p>
    </div>

    <!-- LOBBY -->
    <div id="lobbyView" class="card lobby-landscape" style="display:none;">
      <div class="lobby-left">
        <p class="lobby-label">Scan to join</p>
        <img id="qrImg" class="qr-image" alt="QR code to join" />
        <p class="lobby-url" id="joinUrlText"></p>
      </div>
      <div class="lobby-right">
        <p class="lobby-label">Or enter PIN at <span id="joinUrl"></span></p>
        <div class="pin-display" id="pinDisplay">------</div>
        <p class="session-label" id="sessionLabel"></p>
        <div class="player-list" id="playerList"></div>
        <button id="startBtn" class="start-btn">Start Game</button>
      </div>
    </div>

    <!-- QUESTION VIEW -->
    <div id="questionView" class="fullscreen-view" style="display:none;">
      <p id="questionMeta" class="q-meta"></p>
      <div class="bilingual-question">
        <div class="q-en" id="questionTextVn"></div>
        <div class="q-l2" id="questionTextEn"></div>
      </div>
      <div class="timer" id="timerDisplay"></div>
      <p id="answerCount" class="answer-count"></p>
      <div class="answers-grid host-answers-grid" id="hostAnswersGrid"></div>
      <button id="closeQuestionBtn" class="secondary-btn">Close Question Now</button>
    </div>

    <!-- CLOSED (waiting to advance) -->
    <div id="closedView" class="fullscreen-view" style="display:none;">
      <h2>🔒 Answers locked in</h2>
      <p>Correct answer and discussion happen after the full quiz.</p>
      <button id="nextBtn" class="start-btn">Next Question</button>
    </div>

    <!-- GAME OVER -->
    <div id="overView" class="card" style="display:none;">
      <h2>🏆 Final Results</h2>
      <div id="finalLeaderboard"></div>
      <p class="saved-note">Results have been saved to the Google Sheet (summary + per-question detail).</p>
      <button id="startReviewBtn" class="start-btn">Start Answer Discussion</button>
      <a class="link-btn" href="index.html">Back to home</a>
    </div>

    <!-- REVIEW / DISCUSSION VIEW -->
    <div id="reviewView" class="fullscreen-view" style="display:none;">
      <p id="reviewMeta" class="q-meta"></p>
      <div class="bilingual-question">
        <div class="q-en" id="reviewTextVn"></div>
        <div class="q-l2" id="reviewTextEn"></div>
      </div>
      <div class="answers-grid host-answers-grid" id="reviewAnswersGrid"></div>
      <div class="review-nav">
        <button id="reviewPrevBtn" class="secondary-btn">◀ Previous</button>
        <button id="reviewNextBtn" class="secondary-btn">Next ▶</button>
        <a class="link-btn" href="index.html">Finish</a>
      </div>
    </div>

    <p id="hostErrorMsg" class="error-text"></p>
    <button id="fullscreenBtn" class="fs-btn" title="Toggle fullscreen for projector">⛶</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const createView = document.getElementById('createView');
    const lobbyView = document.getElementById('lobbyView');
    const questionView = document.getElementById('questionView');
    const closedView = document.getElementById('closedView');
    const overView = document.getElementById('overView');
    const reviewView = document.getElementById('reviewView');

    document.getElementById('joinUrl').textContent = window.location.origin + '/player.html';

    document.getElementById('fullscreenBtn').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
      else document.exitFullscreen();
    };

    // Populate the "Question Sheet Tab" dropdown with the real tab names
    // pulled live from the Google Sheet, so the host picks from a list
    // instead of typing an exact tab name from memory.
    async function loadTabs() {
      const select = document.getElementById('sheetTabSelect');
      const errEl = document.getElementById('tabLoadError');
      try {
        const res = await fetch('/api/tabs');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to load tabs');
        select.innerHTML = '';
        if (!data.tabs.length) {
          select.innerHTML = '<option value="">No question tabs found</option>';
          return;
        }
        data.tabs.forEach((tab) => {
          const opt = document.createElement('option');
          opt.value = tab;
          opt.textContent = tab;
          select.appendChild(opt);
        });
      } catch (err) {
        errEl.textContent = `Could not load sheet tabs: ${err.message}`;
        select.innerHTML = '<option value="Questions">Questions (default)</option>';
      }
    }
    loadTabs();

    document.getElementById('createBtn').onclick = () => {
      const sessionName = document.getElementById('sessionNameInput').value.trim() || 'Untitled Session';
      const sheetTab = document.getElementById('sheetTabSelect').value.trim() || 'Questions';
      socket.emit('host:create', { sessionName, sheetTab, origin: window.location.origin });
    };

    socket.on('host:created', ({ pin, qrDataUrl, joinUrl, sessionName }) => {
      document.getElementById('pinDisplay').textContent = pin;
      document.getElementById('sessionLabel').textContent = `Session: ${sessionName}`;
      document.getElementById('joinUrlText').textContent = joinUrl.replace(/^https?:\/\//, '');
      if (qrDataUrl) document.getElementById('qrImg').src = qrDataUrl;
      createView.style.display = 'none';
      lobbyView.style.display = 'flex';
    });

    socket.on('host:playerJoined', ({ players }) => {
      const list = document.getElementById('playerList');
      list.innerHTML = '';
      players.forEach((p) => {
        const chip = document.createElement('div');
        chip.className = 'player-chip';
        chip.textContent = p.name;
        list.appendChild(chip);
      });
    });

    document.getElementById('startBtn').onclick = () => socket.emit('host:start');
    document.getElementById('closeQuestionBtn').onclick = () => socket.emit('host:closeQuestion');
    document.getElementById('nextBtn').onclick = () => socket.emit('host:next');

    let timerInterval = null;

    socket.on('question:show', ({ index, total, question_vn, question_en, options_vn, options_en, timeLimit }) => {
      lobbyView.style.display = 'none';
      closedView.style.display = 'none';
      overView.style.display = 'none';
      questionView.style.display = 'flex';

      document.getElementById('questionMeta').textContent = `Question ${index + 1} / ${total}`;
      document.getElementById('questionTextVn').textContent = question_vn;
      document.getElementById('questionTextEn').textContent = question_en || '';
      document.getElementById('answerCount').textContent = '';

      const grid = document.getElementById('hostAnswersGrid');
      grid.innerHTML = '';
      options_vn.forEach((opt, i) => {
        if (!opt) return;
        const btn = document.createElement('div');
        btn.className = 'answer-btn static-answer';
        btn.innerHTML = `<div class="opt-en">${opt}</div><div class="opt-l2">${options_en[i] || ''}</div>`;
        grid.appendChild(btn);
      });

      let remaining = timeLimit;
      const timerEl = document.getElementById('timerDisplay');
      timerEl.textContent = `⏱ ${remaining}s`;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        remaining -= 1;
        timerEl.textContent = `⏱ ${Math.max(remaining, 0)}s`;
        if (remaining <= 0) clearInterval(timerInterval);
      }, 1000);
    });

    socket.on('host:answerCount', ({ answered, total }) => {
      document.getElementById('answerCount').textContent = `${answered}/${total} answered`;
    });

    socket.on('question:closed', ({ isLastQuestion }) => {
      if (timerInterval) clearInterval(timerInterval);
      questionView.style.display = 'none';
      closedView.style.display = 'flex';
      document.getElementById('nextBtn').textContent = isLastQuestion ? 'Show Final Results' : 'Next Question';
    });

    socket.on('game:over', ({ leaderboard }) => {
      closedView.style.display = 'none';
      overView.style.display = 'block';
      const lb = document.getElementById('finalLeaderboard');
      lb.innerHTML = '';
      leaderboard.forEach((p, i) => {
        const row = document.createElement('div');
        row.className = `leaderboard-item rank-${i}`;
        row.innerHTML = `<span>#${i + 1} ${p.name}</span><span>${p.score}</span>`;
        lb.appendChild(row);
      });
    });

    document.getElementById('startReviewBtn').onclick = () => socket.emit('host:reviewStart');
    document.getElementById('reviewNextBtn').onclick = () => socket.emit('host:reviewNext');
    document.getElementById('reviewPrevBtn').onclick = () => socket.emit('host:reviewPrev');

    socket.on('review:show', ({ index, total, question_vn, question_en, options_vn, options_en, correctIndex, tally }) => {
      overView.style.display = 'none';
      reviewView.style.display = 'flex';
      document.getElementById('reviewMeta').textContent = `Discussion — Question ${index + 1} / ${total}`;
      document.getElementById('reviewTextVn').textContent = question_vn;
      document.getElementById('reviewTextEn').textContent = question_en || '';

      const grid = document.getElementById('reviewAnswersGrid');
      grid.innerHTML = '';
      const totalAnswers = tally.reduce((a, b) => a + b, 0) || 1;
      options_vn.forEach((opt, i) => {
        if (!opt) return;
        const btn = document.createElement('div');
        btn.className = 'answer-btn static-answer review-answer' + (i === correctIndex ? ' correct-option' : '');
        const pct = Math.round((tally[i] / totalAnswers) * 100);
        btn.innerHTML = `<div class="opt-en">${opt}${i === correctIndex ? ' ✅' : ''}</div><div class="opt-l2">${options_en[i] || ''}</div><div class="tally-bar"><div class="tally-fill" style="width:${pct}%"></div></div><div class="tally-count">${tally[i]} response(s)</div>`;
        grid.appendChild(btn);
      });
    });

    socket.on('error:message', (msg) => {
      document.getElementById('hostErrorMsg').textContent = msg;
      document.getElementById('createError').textContent = msg;
    });
  </script>
</body>
</html>
